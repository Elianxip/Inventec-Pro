{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="error-page"><div class="error-code">{{ code }}</div><h1>Algo no salió como esperábamos.</h1><p class="muted">{{ message }}</p><a class="btn btn-primary" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">Volver al sistema</a></div>
{% endblock %}
